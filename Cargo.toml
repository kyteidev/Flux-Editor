[package]
name = "flux_editor"
version = "0.9.0"
edition = "2021"

[dependencies]
freya = "0.3"
dioxus = { version = "0.6", features = [
    "macro",
    "hooks",
], default-features = false }
self_update = "0.42.0"
semver = "1.0.26"
log = "0.4.27"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
syntect = "5.2.0"
skia-safe = { version = "0.82.0", features = ["textlayout"] }
once_cell = "1.21.3"
tokio = "1.45.1"
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.10"
objc2 = "0.6.1"
